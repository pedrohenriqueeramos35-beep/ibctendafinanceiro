<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>IBC Tenda · Gestão Financeira</title><meta name=robots content=noindex>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600;800&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Pacifico&family=Caveat:wght@600&family=Satisfy&family=Homemade+Apple&display=block" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#ececee;--c:#f6f6f7;--i:#1c2230;--m:#8a8f9a;--g:#6ee787;--gt:#1c9c52;--ln:#dcdde2;--dk:#1c2230;--red:#e5484d;--r:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--c:#1a1e29;--i:#eef0f4;--m:#8d93a1;--ln:#2a2f3c;--dk:#0a0c11;--gt:#6ee787}}
:root[data-theme="dark"]{--bg:#10131a;--c:#1a1e29;--i:#eef0f4;--m:#8d93a1;--ln:#2a2f3c;--dk:#0a0c11;--gt:#6ee787}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--i);font-family:Manrope,system-ui,sans-serif;font-weight:400}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh;transition:grid-template-columns .45s cubic-bezier(.2,.8,.2,1)}
.app.col{grid-template-columns:96px 1fr}.app.foc{grid-template-columns:0 1fr}
aside{position:sticky;top:0;height:100vh;padding:14px 0 14px 14px;overflow:hidden;min-width:0}
.side{background:var(--c);border-radius:26px;height:100%;padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.lgo{background:#fff;border-radius:16px;padding:6px;display:grid;place-items:center;margin-bottom:12px}.lgo img{width:100%;max-height:96px;object-fit:contain;display:block}
.col .lgo{padding:3px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14px;color:var(--m);text-align:left;white-space:nowrap;transition:.3s}
.nv:hover{background:var(--bg);color:var(--i);transform:translateX(3px)}.nv.on{background:var(--dk);color:#fff}.nv.on svg{color:var(--g)}
.col .nv span{display:none}.col .nv{justify-content:center;padding:12px 0}.sp{flex:1}.col #chv svg{transform:rotate(180deg)}#chv svg{transition:.4s}
main{padding:20px 28px 40px;min-width:0}.foc main{padding-top:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.top .sp{flex:1}.top small{color:var(--m);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;background:var(--c);border:1px solid var(--ln);transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px #0008}
.pri{background:var(--dk);color:#fff;border-radius:14px;padding:12px 22px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.3s}.pri:hover{transform:translateY(-2px);box-shadow:0 12px 26px -12px #0009}.pri svg{color:var(--g)}
.ghost{padding:12px 18px;border-radius:14px;border:1px solid var(--ln);font-weight:600}
.ico{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;color:var(--m);transition:.25s}.ico:hover{background:var(--bg);color:var(--i);transform:scale(1.12)}.ico.d:hover{color:var(--red)}.ico.ok:hover{color:var(--gt)}
input[type=month],.top input{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:10px 14px}
.hero{font-weight:200;font-size:clamp(2rem,4.6vw,3.6rem);line-height:1.02;letter-spacing:-.04em;margin:6px 0 22px}.hero b{display:block;font-weight:800}
.row2{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.card{background:var(--c);border-radius:var(--r);padding:22px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;min-width:0}.card:hover{transform:translateY(-3px);box-shadow:0 20px 40px -26px #000a}
.dark{background:var(--dk);color:#fff}.dark .mut,.dark .lab{color:#9aa1b1}.dark .dec{color:#7c8393}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.lab,.mut{color:var(--m);font-size:13px;font-weight:600}
.big{font-weight:300;font-size:clamp(2.2rem,4.4vw,3.8rem);letter-spacing:-.04em;line-height:1.05;margin:6px 0}.big small{font-size:15px;letter-spacing:0;font-weight:600;color:var(--m)}.dec{color:var(--m)}.mid{font-size:1.9rem;font-weight:300;letter-spacing:-.03em;margin-top:6px}
ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--bg);font-weight:600;font-size:14px}.dark li{background:#ffffff12}li i{display:block;font-style:normal;color:var(--m);font-weight:400;font-size:12px}li.empty{color:var(--m);background:none;padding:6px 0;font-weight:400}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);white-space:nowrap}.pill.r{background:#e5484d22;color:var(--red)}.pill.g{background:#6ee78733;color:var(--gt)}
.bars{display:flex;align-items:flex-end;gap:3px;height:180px;margin-top:14px}.bars b{flex:1;height:var(--h);min-height:4px;border-radius:4px;background:var(--ln);transform-origin:bottom;animation:grow .9s var(--d) cubic-bezier(.2,.8,.2,1) both;transition:.2s}.bars b:hover{opacity:.6}
.in .bars b.on{background:var(--g)}.out .bars b.on{background:var(--i)}
.rw{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;align-items:center;padding:9px 0;font-size:14px;font-weight:600}.tr{height:8px;border-radius:9px;background:var(--bg);overflow:hidden}.tr i{display:block;height:100%;width:var(--w);background:var(--g);border-radius:9px;transform-origin:left;animation:gw 1s cubic-bezier(.2,.8,.2,1) both}.out .tr i{background:var(--i)}
.seg{display:inline-flex;background:var(--c);border-radius:16px;padding:4px;gap:2px}.seg button{padding:10px 20px;border-radius:12px;font-weight:600;color:var(--m);transition:.3s}.seg .on{background:var(--dk);color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--m);font-weight:600;padding:10px;font-size:13px}td{padding:12px 10px;border-top:1px solid var(--ln);vertical-align:middle}td.v{font-weight:800;white-space:nowrap}tbody tr{transition:.2s}tbody tr:hover{background:var(--bg)}
.kan{display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;align-items:flex-start}.col2{flex:0 0 296px;background:var(--c);border-radius:22px;padding:14px;transition:.3s;min-height:160px}.col2.over{outline:2px dashed var(--g);background:var(--bg)}
.ch{display:flex;align-items:center;gap:4px}.ch b{flex:1;font-size:15px}.ch .pill{background:var(--dk);color:#fff}.cs{color:var(--m);font-size:13px;font-weight:600;margin:4px 0 10px}
.kc{background:var(--bg);border-radius:16px;padding:13px;margin-bottom:10px;cursor:grab;transition:.25s;animation:up .5s both}.kc:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 14px 26px -18px #000}.kc:active{cursor:grabbing}.kc b{display:block;font-size:14px}.kc .f{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.add{width:100%;padding:11px;border-radius:14px;border:1.5px dashed var(--ln);color:var(--m);font-weight:600;transition:.3s}.add:hover{border-color:var(--g);color:var(--i)}.newc{flex:0 0 220px;background:none;border:1.5px dashed var(--ln);color:var(--m);font-weight:600;display:grid;place-items:center;height:120px}
.modal{position:fixed;inset:0;background:#0a0d1488;backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .25s both}.mc{background:var(--c);border-radius:26px;padding:26px;width:min(460px,100%);max-height:92vh;overflow:auto;animation:pop .45s cubic-bezier(.2,1.2,.3,1) both;display:grid;gap:14px}.mc h3{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--m)}label input,label select,label textarea{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;outline:0;color:var(--i)}label input:focus,label select:focus,label textarea:focus{border-color:var(--g)}.bad{border-color:var(--red)!important}.btns{display:flex;gap:10px;justify-content:flex-end}
.lg{min-height:100vh;display:grid;place-items:center;padding:16px}.lc{width:min(400px,100%);display:grid;gap:14px;padding:30px;animation:pop .7s cubic-bezier(.2,1.1,.3,1) both}.lc h1{margin:0;font-weight:200;font-size:2.4rem;letter-spacing:-.04em;line-height:1}.lc h1 b{font-weight:800}.lc .lgo img{max-height:130px}
.lc label{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:0 14px;border:1px solid var(--ln)}.lc label input{border:0;background:none;padding:14px 0;flex:1}.err{color:var(--red);font-size:13px;font-weight:600;min-height:16px}.shake{animation:sh .4s}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:60;animation:up .4s both}
.fl{position:fixed;left:14px;top:14px;z-index:20}
.still *{animation:none!important}
@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes gw{from{transform:scaleX(0)}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#view>*,.grid>*{animation:up .65s cubic-bezier(.2,.8,.2,1) both}.grid>*:nth-child(2){animation-delay:.07s}.grid>*:nth-child(3){animation-delay:.14s}.grid>*:nth-child(4){animation-delay:.21s}
@media(max-width:760px){.app,.app.col{grid-template-columns:1fr}aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;padding:8px;z-index:30;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}.side{flex-direction:row;padding:6px;border-radius:22px;box-shadow:0 -8px 30px -12px #0006}.side .lgo,.side .sp,.side .xs{display:none}.nv{flex:1;justify-content:center;padding:12px 0}.nv span{display:none}main{padding:14px 14px 100px}.foc aside{display:none}}
*{animation-fill-mode:backwards!important}.big,.mid,td.v,.cs,b{font-variant-numeric:tabular-nums}#view>.grid,#view>.in,#view>.out,#view>.kan{animation:none}.bars b,.card,.kc{backface-visibility:hidden}</style></head><body><div id="root"></div>

function shareM(){const m=document.createElement('div');m.className='modal';const L=S.share?location.origin+location.pathname+'#v='+S.share:'';m.innerHTML=`<div class=mc><h3>Link de visitante</h3><div class=mut>Quem tiver o link só visualiza: sem editar, sem CPF das assinaturas e sem anexos. Os dados acompanham o sistema.</div>${L?`<label>Link para compartilhar<input id=sl readonly value="${e(L)}" onclick="this.select()"></label>`:''}<div class=btns><button class=ghost data-x>Fechar</button>${L?'<button class=ghost data-d>Desativar</button>':''}<button class=pri data-g>${L?'Gerar novo link':'Criar link'}</button></div></div>`;document.body.appendChild(m);
 m.onclick=async ev=>{const t=ev.target;if(t==m||t.closest('[data-x]'))m.remove();else if(t.closest('[data-d]')){await sb.from('shares').delete().eq('token',S.share);delete S.share;save();m.remove();toast('Link desativado')}else if(t.closest('[data-g]')){if(S.share)await sb.from('shares').delete().eq('token',S.share);S.share=crypto.randomUUID().replace(/-/g,'');const{error}=await sb.from('shares').upsert({token:S.share,j:snap()});if(error){delete S.share;return toast('Falta rodar o SQL do link de visitante no Supabase')}save();m.remove();shareM()}}}
async function init(){if(!OK_CFG)return init0();const h=location.hash.match(/^#v=(\w+)/);
 if(!h){try{const{data}=await sb.from('public_cfg').select('j').eq('id','logo').maybeSingle();if(data&&data.j)LOGO_L=data.j}catch{}return init0()}
 const{data,error}=await sb.rpc('get_share',{t:h[1]});
 if(error||!data){$('#root').innerHTML='<div class=lg><div class="lc card"><h1>Link <b>inválido</b></h1><div class=mut>Este link de visitante não existe ou foi desativado.</div></div></div>';return}
 S=JSON.parse(data);VIS=true;sess=true;window.pull=async()=>false;window.save=()=>{};
 ['addC','edC','openC','delC','payM','nextM','lateNext','autoM','addM','edM','sM','entM','delM2','delM','addS','renS','delS','cxM','cxD','sigM','sigD','chLogo','chPass','dupS','shareM','drop','drop2','aiAsk','cobM','recC','delCob','ofxM'].forEach(n=>window[n]=()=>toast('Modo visitante: somente visualização'));
 for(let i=TABS.length-1;i>=0;i--)if(['sig','ai','sic'].includes(TABS[i][0]))TABS.splice(i,1);
 document.body.insertAdjacentHTML('afterbegin','<div style="background:var(--dk);color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:600">Modo visitante · somente visualização</div>');render()}
/* Sicredi */
function vSic(){S.cob=S.cob||[];return`<div class=row2><h2 class=hero>Sicredi<b>conta e cobranças.</b></h2><div class=tl><button class=pri onclick=ofxM()>${ic('dl',16)}Importar extrato (OFX/CSV)</button><button class=btn onclick=cobM()>${ic('plus',16)}Nova cobrança</button></div></div>
<div class="grid g3"><div class="card dark"><div class=lab>Entradas vindas do banco</div><div class=big data-n=${S.ent.filter(x=>x.fit).length} data-k=n>0</div><div class=mut>já aparecem no Dashboard de Entradas</div></div><div class=card><div class=lab>Cobranças pendentes</div><div class=big data-n=${S.cob.filter(c=>c.st!='Recebida').length} data-k=n>0</div></div><div class=card><div class=lab>Contas a pagar no CRM</div><div class=big data-n=${S.contas.filter(c=>rest(c)>0).length} data-k=n>0</div></div></div>
<div class=card><div class=lab>Cobranças: boleto, Pix e link de pagamento</div><div class=tw><table><thead><tr><th>Tipo<th>Descrição<th>Vencimento<th>Linha digitável / link<th>Valor<th>Situação<th></thead><tbody>${S.cob.map(c=>`<tr><td>${e(c.tipo)}<td><b>${e(c.n)}</b><td>${fD(c.d)}<td class=mut style="max-width:220px;overflow:hidden;text-overflow:ellipsis">${e(c.link)}<td class=v>${fmt(c.v)}<td><span class="pill ${c.st=='Recebida'?'g':''}">${e(c.st)}</span><td style="white-space:nowrap">${c.st!='Recebida'?`<button class="ico ok" title="Marcar como recebida (vira entrada)" onclick="recC('${c.id}')">${ic('check',16)}</button>`:''}<button class=ico onclick="cobM('${c.id}')">${ic('edit',16)}</button><button class="ico d" onclick="delCob('${c.id}')">${ic('trash',16)}</button>`).join('')||'<tr><td colspan=7 class=mut>Nenhuma cobrança. Registre aqui os boletos, Pix e links gerados no Sicredi.'}</tbody></table></div></div>
<div class=card style="margin-top:16px"><div class=lab>Pagar contas do CRM pelo Sicredi</div><ul>${S.contas.filter(c=>rest(c)>0).sort((a,b)=>dd(a.d)-dd(b.d)).slice(0,30).map(c=>`<li><span>${e(c.n)}<i>${fD(c.d)} · falta ${fmt(rest(c))}</i></span><span style="display:flex;gap:6px;align-items:center"><a class="btn ib" href="https://www.sicredi.com.br/" target=_blank rel=noopener>Abrir Sicredi</a><button class="ico ok" title="Registrar pagamento" onclick="payM('${c.id}')">${ic('check',16)}</button></span></li>`).join('')||'<li class=empty>Nenhuma conta pendente</li>'}</ul></div>
<div class=card style="margin-top:16px"><div class=lab>Integração automática por API</div><div class=mut style="font-weight:400;line-height:1.6;margin-top:8px">Ainda não conectada. A API do Sicredi exige contrato PJ, credenciais do Portal do Desenvolvedor Sicredi (client_id, client_secret e certificado mTLS) e, para boletos, as credenciais de Cobrança. Enquanto isso, o extrato importado já alimenta entradas, saídas e o CRM.</div></div>`}
function cobM(id){const c=id&&S.cob.find(x=>x.id==id);form(c?'Editar cobrança':'Nova cobrança',[{k:'n',l:'Descrição'},{k:'tipo',l:'Tipo',t:'select',o:[['Boleto','Boleto'],['Pix','Pix'],['Link de pagamento','Link de pagamento']]},{k:'v',l:'Valor (R$)',t:'number'},{k:'d',l:'Vencimento',t:'date'},{k:'link',l:'Linha digitável ou link'},{k:'st',l:'Situação',t:'select',o:[['Pendente','Pendente'],['Recebida','Recebida']]}],c||{tipo:'Boleto',st:'Pendente',d:today()},v=>{if(c)Object.assign(c,v,{v:+v.v||0});else S.cob.push({id:uid(),...v,v:+v.v||0});save();render()})}
function recC(id){const c=S.cob.find(x=>x.id==id);ask('Marcar como recebida? Ela vira uma entrada no dashboard.',()=>{c.st='Recebida';const p=c.tipo=='Pix'?c.v:0;S.ent.push({id:uid(),gid:uid(),n:c.n,c:'Cobrança Sicredi',v:c.v,pix:p,cartao:0,din:0,d:today(),o:c.tipo+(c.link?' · '+c.link:''),cob:c.id});save();render()})}
function delCob(id){ask('Excluir esta cobrança?',()=>{S.cob=S.cob.filter(c=>c.id!=id);save();render()})}
function pOfx(t){return[...t.matchAll(/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>))/gi)].map(m=>{const g=k=>((m[1].match(new RegExp('<'+k+'>([^<\\r\\n]*)','i'))||[])[1]||'').trim(),d=g('DTPOSTED');return{id:g('FITID'),d:d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8),v:parseFloat(g('TRNAMT').replace(',','.')),n:g('MEMO')||g('NAME')}})}
function pCsv(t){return t.split(/\r?\n/).map(l=>l.split(';').map(s=>s.replace(/^"|"$/g,'').trim())).map(a=>{const dc=a.find(s=>/^\d{2}\/\d{2}\/\d{4}$/.test(s)),vc=[...a].reverse().find(s=>/^-?[\d.]*\d,\d{2}$/.test(s));if(!dc||!vc)return null;const[d,m,y]=dc.split('/'),v=parseFloat(vc.replace(/\./g,'').replace(',','.')),n=a.filter(s=>s!=dc&&s!=vc).join(' ').trim();return{id:'csv'+dc+v+n.slice(0,20),d:y+'-'+m+'-'+d,v,n}}).filter(Boolean)}
function ofxM(){const i=document.createElement('input');i.type='file';i.accept='.ofx,.csv,.txt';i.onchange=async()=>{const f=i.files[0];if(!f)return;const tx=await f.text();impB(/<STMTTRN>/i.test(tx)?pOfx(tx):pCsv(tx))};i.click()}
function impB(R){let a=0,b=0,k=0;const has=id=>S.ent.some(x=>x.fit==id)||S.sai.some(x=>x.fit==id);R.forEach(r=>{if(!r.id||has(r.id)||isNaN(r.v)||!r.d)return;if(r.v>0){S.ent.push({id:uid(),gid:uid(),n:r.n,c:'Sicredi',v:r.v,pix:/pix/i.test(r.n)?r.v:0,cartao:0,din:0,d:r.d,o:'Importado do extrato Sicredi',fit:r.id});a++}else{const v=Math.abs(r.v),c=S.contas.find(z=>rest(z)>0&&Math.abs(rest(z)-v)<.01);if(c){c.pays.push({v,f:'banco',t:r.d+'T12:00:00',fit:r.id});if(rest(c)<=0&&S.stages.some(s=>s.id==c.o))c.s=c.o;k++}S.sai.push({id:uid(),n:r.n,c:c?'Contas (CRM)':'Sicredi',v,f:'banco',d:r.d,o:c?'Conciliado com a conta: '+c.n:'Importado do extrato Sicredi',fit:r.id});b++}});save();render();toast(a+' entrada(s), '+b+' saída(s), '+k+' conta(s) conciliada(s)')}
function repS(){return{t:'Sicredi',s:[{h:'Cobranças',H:['Tipo','Descrição','Valor','Vencimento','Situação'],r:(S.cob||[]).map(c=>[c.tipo,c.n,fmt(c.v),fD(c.d),c.st])},{h:'Movimentos importados do extrato',H:['Data','Descrição','Tipo','Valor'],r:[...S.ent.filter(x=>x.fit).map(x=>[fD(x.d),x.n,'Entrada',fmt(x.v)]),...S.sai.filter(x=>x.fit).map(x=>[fD(x.d),x.n,'Saída',fmt(x.v)])]}]}}

init();
</script></body></html>
